name: Release npm

on:
  push:
    tags:
      - "npm-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g., 0.1.0)"
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            ext: ""
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            platform: linux-aarch64
            ext: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            platform: macos-x86_64
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos-aarch64
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            ext: ".exe"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#npm-v}"
          fi
          echo "Setting version to ${VERSION}"
          sed -i.bak -e "/^\[workspace\.package\]/,/^\[/{s/^version = \".*\"/version = \"${VERSION}\"/;}" Cargo.toml
          rm -f Cargo.toml.bak

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-${{ matrix.target }}-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-build-
            ${{ runner.os }}-${{ matrix.target }}-

      - name: Install cross
        if: runner.os == 'Linux'
        run: cargo install cross

      - name: Build cc-code (Linux)
        if: runner.os == 'Linux'
        run: cross build -p cc-tui --release --target ${{ matrix.target }}

      - name: Build cc-code (non-Linux)
        if: runner.os != 'Linux'
        run: cargo build -p cc-tui --release --target ${{ matrix.target }}

      - name: Package binaries (Unix)
        if: matrix.ext == ''
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/cc-code dist/cc-code-${{ matrix.platform }}
          chmod +x dist/cc-code-${{ matrix.platform }}
          tar -czf dist/cc-code-${{ matrix.platform }}.tar.gz -C dist cc-code-${{ matrix.platform }}
          rm dist/cc-code-${{ matrix.platform }}

      - name: Package binaries (Windows)
        if: matrix.ext == '.exe'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "target/${{ matrix.target }}/release/cc-code.exe" "dist/cc-code-${{ matrix.platform }}.exe"
          Compress-Archive -Path "dist/cc-code-${{ matrix.platform }}.exe" -DestinationPath "dist/cc-code-${{ matrix.platform }}.zip"
          Remove-Item "dist/cc-code-${{ matrix.platform }}.exe"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.platform }}
          path: dist/
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#npm-v}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Create tag (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        run: |
          if git rev-parse "npm-v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "Tag npm-v${{ steps.version.outputs.version }} already exists, skipping creation"
          else
            git tag "npm-v${{ steps.version.outputs.version }}"
            git push origin "npm-v${{ steps.version.outputs.version }}"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "npm-v${{ steps.version.outputs.version }}"
          files: |
            artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.version.outputs.version, '-alpha') || contains(steps.version.outputs.version, '-beta') || contains(steps.version.outputs.version, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish to npm
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          scope: "@cc-claw"

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#npm-v}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Download ripgrep
        # Bundled into each platform package so a plain npm install needs a
        # single registry round-trip and no system `rg`. A failure here only
        # costs the speed-up (Grep falls back to the built-in engine), so the
        # step is allowed to fail without sinking the release.
        continue-on-error: true
        run: |
          set -euo pipefail
          RG_VERSION=15.0.1
          # Consumed by the "Build platform packages" step.
          echo "RG_VERSION=${RG_VERSION}" >> "$GITHUB_ENV"
          # Keyed by npm platform id — the same ids the build step reads back.
          # (The upstream asset triples are a different namespace, so mapping
          # the two by hand is what keeps the bundle from silently missing.)
          declare -A RG_SUFFIX=(
            [linux-x64]=x86_64-unknown-linux-musl
            [linux-arm64]=aarch64-unknown-linux-gnu
            [darwin-x64]=x86_64-apple-darwin
            [darwin-arm64]=aarch64-apple-darwin
            [win32-x64]=x86_64-pc-windows-msvc
          )
          mkdir -p rg
          for platform in "${!RG_SUFFIX[@]}"; do
            suffix="${RG_SUFFIX[$platform]}"
            if [ "$platform" = "win32-x64" ]; then ext=zip; else ext=tar.gz; fi
            asset="ripgrep-v${RG_VERSION}-${suffix}.${ext}"
            url="https://github.com/microsoft/ripgrep-prebuilt/releases/download/v${RG_VERSION}/${asset}"
            if ! curl -fsSL -o "rg/${asset}" "$url"; then
              echo "::warning::ripgrep asset unavailable: ${asset}"
              continue
            fi
            mkdir -p "rg/${platform}"
            if [ "$ext" = "zip" ]; then
              # Upstream zip holds a single rg.exe at its root. Keep the .exe
              # suffix: Rust looks for `rg.exe` on Windows, and npm must ship a
              # name that stays executable there.
              unzip -o -j "rg/${asset}" rg.exe -d "rg/${platform}"
            else
              # Upstream tar.gz holds a single rg at its root.
              tar -xzf "rg/${asset}" -C "rg/${platform}" rg
              chmod +x "rg/${platform}/rg"
            fi
            "rg/${platform}/rg" --version 2>/dev/null | head -n1 \
              || "rg/${platform}/rg.exe" --version 2>/dev/null | head -n1 \
              || true
          done
          find rg -type f \( -name rg -o -name rg.exe \) -exec ls -lh {} \;

      - name: Build platform packages
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          for platform in win32-x64 darwin-x64 darwin-arm64 linux-x64 linux-arm64; do
            binary=""
            rg=""
            case "$platform" in
              win32-x64)     binary="artifacts/cc-code-windows-x86_64.zip" ;;
              darwin-x64)    binary="artifacts/cc-code-macos-x86_64.tar.gz" ;;
              darwin-arm64)  binary="artifacts/cc-code-macos-aarch64.tar.gz" ;;
              linux-x64)     binary="artifacts/cc-code-linux-x86_64.tar.gz" ;;
              linux-arm64)   binary="artifacts/cc-code-linux-aarch64.tar.gz" ;;
            esac
            if [ ! -f "$binary" ]; then
              echo "::error::missing release asset $binary"
              exit 1
            fi
            # Extract the single cc-code binary out of the release archive.
            # A workspace-relative dir is used instead of `mktemp -d`: on the
            # Windows runners Git Bash hands back an MSYS path that native
            # Windows tools (node) cannot open.
            work="extract-${platform}"
            rm -rf "$work"
            mkdir -p "$work"
            case "$binary" in
              *.zip) unzip -o -j "$binary" 'cc-code-*' -d "$work" ;;
              *)     tar -xzf "$binary" -C "$work" ;;
            esac
            # `find | head` would die of SIGPIPE under `set -o pipefail`;
            # collect into an array instead.
            mapfile -t found < <(find "$work" -type f -name 'cc-code*')
            if [ "${#found[@]}" -eq 0 ]; then
              echo "::error::no cc-code binary inside $binary"
              exit 1
            fi
            exe="${found[0]}"
            case "$platform" in
              win32-x64) rg="rg/win32-x64/rg.exe" ;;
              darwin-x64) rg="rg/darwin-x64/rg" ;;
              darwin-arm64) rg="rg/darwin-arm64/rg" ;;
              linux-x64) rg="rg/linux-x64/rg" ;;
              linux-arm64) rg="rg/linux-arm64/rg" ;;
            esac
            [ -f "$rg" ] || rg=""
            # Only the runner's own platform can be asked for --version; for the
            # cross-built ones the README simply omits the number rather than
            # claiming a version nobody verified.
            rg_version=""
            if [ -n "$rg" ]; then
              rg_version="$("$rg" --version 2>/dev/null | sed -n 's/^ripgrep \([0-9.]*\).*/\1/p' | head -n1 || true)"
            fi
            args=(--platform "$platform" --binary "$exe" --version "$VERSION" --out platform-packages)
            if [ -n "$rg" ]; then
              args+=(--rg "$rg")
              if [ -n "$rg_version" ]; then
                args+=(--rg-version "$rg_version")
              fi
            fi
            node npm/scripts/build-platform-package.js "${args[@]}"
            rm -rf "$work"
          done
          find platform-packages -name package.json -exec sh -c 'echo "--- $1"; cat "$1"' _ {} \;

      - name: Publish platform packages
        # Must run before the main package: the main package's
        # optionalDependencies pin these exact versions, and npm install fails
        # to resolve a dependency that is not on the registry yet.
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          for platform in win32-x64 darwin-x64 darwin-arm64 linux-x64 linux-arm64; do
            cd "platform-packages/${platform}"
            if npm view "@cc-claw/code-${platform}@${VERSION}" version >/dev/null 2>&1; then
              echo "::warning::@cc-claw/code-${platform}@${VERSION} already published, skipping"
              cd ../..
              continue
            fi
            npm publish --access public
            cd ../..
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Set main package version
        run: |
          set -euo pipefail
          cd npm
          # --allow-same-version：支持 package.json 已预 bump 到目标版本的场景
          # （发布前同步维护 version 字段时，npm version 默认会拒绝无变化的设置）
          npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version
          # optionalDependencies 的版本必须与主包严格一致（不带 ^），
          # 否则会解析到与主包不匹配的平台二进制。
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf-8"));
            for (const name of Object.keys(pkg.optionalDependencies || {})) {
              // 仅同步本仓库发布的平台包，避免误改第三方可选依赖。
              if (name.startsWith("@cc-claw/code-")) {
                pkg.optionalDependencies[name] = pkg.version;
              }
            }
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 4) + "\n");
          '
          cat package.json

      - name: Verify platform packages are resolvable
        # Catches the ordering mistake above before the main package is pushed:
        # a missing platform package makes every install of this version fail.
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          for platform in win32-x64 darwin-x64 darwin-arm64 linux-x64 linux-arm64; do
            npm view "@cc-claw/code-${platform}@${VERSION}" version >/dev/null \
              || { echo "::error::@cc-claw/code-${platform}@${VERSION} is not on the registry"; exit 1; }
          done

      - name: Publish main package
        run: |
          cd npm
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
