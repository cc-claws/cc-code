[package]
name = "cc-tools"
version.workspace = true
edition.workspace = true
description = "Stateless core tools and cross-platform process wrappers (leaf crate)"
license.workspace = true
authors.workspace = true

[dependencies]
cc-agent = { path = "../cc-agent" }
cc-compress = { path = "../cc-compress" }
async-trait.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
uuid.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tempfile.workspace = true
encoding_rs.workspace = true
dirs-next.workspace = true
base64 = { version = "0.22", features = ["alloc"] }
glob = "0.3"
ignore = "0.4"
grep = "0.4"
regex = "1"
num_cpus = "1"

[target.'cfg(windows)'.dependencies]
process-wrap = { version = "9.1", default-features = false, features = ["tokio1", "job-object"] }
windows = { version = "0.62", features = ["Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
filetime = "0.2"
tracing-subscriber.workspace = true
