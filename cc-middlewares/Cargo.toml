[package]
name = "cc-middlewares"
version.workspace = true
edition.workspace = true
description = "Rust Agent middleware implementations, aligned with @langgraph-js/agent-middlewares"
license.workspace = true
authors.workspace = true

[dependencies]
cc-agent = { path = "../cc-agent" }
anyhow.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["process"] }
encoding_rs.workspace = true
glob = "0.3"
walkdir = "2.5"
ignore = "0.4"
gray_matter = "0.3"
dirs-next.workspace = true
serde_yaml.workspace = true
chrono.workspace = true
uuid.workspace = true
croner = "3"
tracing.workspace = true
parking_lot.workspace = true
grep = "0.4"
num_cpus = "1"
rmcp = { version = "1.7", features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
    "auth",
] }
reqwest = { workspace = true, features = ["gzip", "brotli", "deflate"] }
url.workspace = true
regex = "1"
flate2 = "1"
tar = "0.4"

shellexpand = "3"
ipnet = "2.10"
base64 = { version = "0.22", features = ["alloc"] }
cc-lsp = { path = "../cc-lsp" }
lsp-types.workspace = true

[target.'cfg(windows)'.dependencies]
process-wrap = { version = "9.1", default-features = false, features = ["tokio1", "job-object"] }
windows = { version = "0.62", features = ["Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"


[dev-dependencies]
filetime = "0.2"
# 端到端探针需要看到 tracing 输出（否则 warn! 会被静默丢弃，无从排查）
tracing-subscriber.workspace = true
