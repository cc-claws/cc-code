[package]
name = "cc-acp"
version.workspace = true
edition.workspace = true
description = "ACP Agent service layer — Session management, Agent construction, Middleware chain, Transport abstraction"
license.workspace = true
authors.workspace = true

[lib]
name = "cc_acp"
path = "src/lib.rs"

[dependencies]
cc-agent = { path = "../cc-agent" }
cc-middlewares = { path = "../cc-middlewares" }
cc-lsp = { path = "../cc-lsp" }
langfuse-client = { path = "../langfuse-client" }
agent-client-protocol = { version = "0.11", features = ["unstable"] }
agent-client-protocol-schema = { version = "0.12", features = ["unstable_elicitation", "unstable_auth_methods"] }
agent-client-protocol-tokio = { version = "0.11" }
tokio.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
parking_lot.workspace = true
tracing.workspace = true
anyhow.workspace = true
uuid.workspace = true
chrono.workspace = true
dashmap = "6"
tokio-util.workspace = true
dirs-next.workspace = true

[dev-dependencies]
tempfile.workspace = true
