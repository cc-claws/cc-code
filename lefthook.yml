# lefthook.yml - Git hooks managed by lefthook
# Install: lefthook install
# Run manually: lefthook run pre-commit

pre-commit:
  parallel: true
  commands:
    fmt:
      glob: "*.rs"
      run: cargo fmt --all -- --check
      fix: cargo fmt --all

    check:
      glob: "*.rs"
      run: cargo check --workspace --all-targets

    clippy:
      glob: "*.rs"
      # 与 CI 保持一致（.github/workflows/ci.yml）：-D warnings 把 lint 升级为
      # error。旧配置用 `-W clippy::all` 只告警不拦截，会出现「本地 lefthook
      # 通过、CI 变红」（如 PR #339 的 manual_slice_size_calculation）。
      run: cargo clippy --workspace --all-targets -- -D warnings
