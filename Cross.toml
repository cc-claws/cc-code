# ============================================================================
# Cross-compilation configuration for `cross` (https://github.com/cross-rs/cross)
#
# CI builds Linux x86_64 / aarch64 via:
#   cross build -p cc-tui --release --target <target>
#
# ARM32 (arm-unknown-linux-musleabihf / arm-unknown-linux-gnueabihf) targets and
# their pre-build toolchain were removed — the project does not ship an arm32 build.
#
# 显式钉住官方镜像：不指定 `image` 时 cross 会基于 ubuntu:16.04 自建镜像，
# 而该镜像的 apt 源已失效（`apt-get update` 报
# `Could not resolve 'archive.archive.ubuntu.com'`，双重 archive 前缀是旧镜像
# 自带 sources.list 的问题），导致 pre-build 直接失败、构建无法开始。
# 官方镜像基于 Ubuntu 20.04，源仍然可用。

[target.x86_64-unknown-linux-gnu]
image = "ghcr.io/cross-rs/x86_64-unknown-linux-gnu:0.2.5"
pre-build = [
    "apt-get update",
    "apt-get install -y libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libssl-dev pkg-config",
]

[target.aarch64-unknown-linux-gnu]
image = "ghcr.io/cross-rs/aarch64-unknown-linux-gnu:0.2.5"
pre-build = [
    "apt-get update",
    "apt-get install -y libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libssl-dev pkg-config",
]
